<nav aria-label="Scope" class="space-y-0.5">
  <p class="mb-2 px-2 font-mono text-[11px] uppercase tracking-wider text-text-dim">Scope</p>

  <button
    type="button"
    [class]="TreeItemClasses(filters().level === 'all')"
    [attr.aria-current]="filters().level === 'all' ? 'true' : null"
    (click)="navigate.emit({ level: 'all' })"
  >
    <span class="min-w-0 flex-1 truncate">Everything</span>
  </button>

  @if (showOrgLevel()) {
    <button
      type="button"
      [class]="TreeItemClasses(filters().level === 'organization')"
      [attr.aria-current]="filters().level === 'organization' ? 'true' : null"
      (click)="navigate.emit({ level: 'organization' })"
    >
      <span class="shrink-0 opacity-80">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
      </span>
      <span class="min-w-0 flex-1 truncate">Organization<span class="ml-1 truncate opacity-70">&middot; {{ org() }}</span></span>
    </button>
  }

  @if (repo(); as repoName) {
    <button
      type="button"
      [class]="TreeItemClasses(filters().level === 'repository')"
      [attr.aria-current]="filters().level === 'repository' ? 'true' : null"
      (click)="navigate.emit({ level: 'repository' })"
    >
      <span class="shrink-0 opacity-80">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
        </svg>
      </span>
      <span class="min-w-0 flex-1 truncate">Repository<span class="ml-1 truncate opacity-70">&middot; {{ repoName }}</span></span>
    </button>

    <div class="ml-4 space-y-0.5 border-l border-line pl-3">
      @for (env of environments(); track env.id) {
        <div [class]="EnvironmentRowClasses(filters().level === 'environment' && filters().env === env.name)">
          <button
            type="button"
            [class]="EnvironmentLabelClasses(filters().level === 'environment' && filters().env === env.name)"
            [attr.aria-current]="filters().level === 'environment' && filters().env === env.name ? 'true' : null"
            (click)="navigate.emit({ level: 'environment', env: env.name })"
          >
            <span class="shrink-0 opacity-80">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="m12 2 9 4.9v10.2L12 22l-9-4.9V6.9L12 2Z" />
                <path d="M12 22v-9.1M3 6.9l9 5 9-5" />
              </svg>
            </span>
            <span class="min-w-0 flex-1 truncate">{{ env.name }}</span>
          </button>
          <button
            type="button"
            (click)="renameEnvironment.emit(env.name)"
            title='Rename environment "{{ env.name }}"'
            class="shrink-0 rounded p-1 text-text-dim opacity-0 hover:text-text group-hover:opacity-100"
          >
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" />
            </svg>
          </button>
          <button
            type="button"
            (click)="copyEnvironment.emit(env.name)"
            title='Copy variables from "{{ env.name }}" to another environment'
            class="shrink-0 rounded p-1 text-text-dim opacity-0 hover:text-brand group-hover:opacity-100"
          >
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="9" y="9" width="12" height="12" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <button
            type="button"
            (click)="deleteEnvironment.emit(env.name)"
            title='Delete environment "{{ env.name }}"'
            class="mr-1 shrink-0 rounded p-1 text-text-dim opacity-0 hover:text-danger group-hover:opacity-100"
          >
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 6h18" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6" />
            </svg>
          </button>
        </div>
      }

      @if (!newEnvOpen()) {
        <button
          type="button"
          (click)="OpenNewEnvForm()"
          class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-sm text-text-dim hover:bg-panel-raised hover:text-text"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New environment
        </button>
      } @else {
        <form (submit)="HandleCreateEnvironment($event)" class="space-y-1.5 px-1 py-1">
          <input
            #newEnvInput
            [value]="newEnvName()"
            (input)="HandleNewEnvNameInput($event)"
            (keydown)="HandleNewEnvKeydown($event)"
            placeholder="production"
            spellcheck="false"
            class="w-full rounded-md border border-line bg-ink px-2 py-1 font-mono text-xs text-text placeholder:text-text-dim/60 focus:border-brand focus:outline-none"
          />
          @if (newEnvError()) {
            <p class="text-xs text-danger">{{ newEnvError() }}</p>
          }
          <div class="flex gap-1.5">
            <button
              type="submit"
              [disabled]="newEnvSubmitting() || !newEnvName().trim()"
              class="rounded-md bg-brand px-2 py-1 text-xs font-medium text-on-brand disabled:opacity-40"
            >
              {{ newEnvSubmitting() ? 'Creating…' : 'Create' }}
            </button>
            <button type="button" (click)="CloseNewEnvForm()" class="rounded-md px-2 py-1 text-xs text-text-dim hover:text-text">
              Cancel
            </button>
          </div>
        </form>
      }
    </div>
  }

  <div class="pt-3">
    <a
      routerLink="/"
      class="flex items-center gap-2 rounded-md px-2 py-1.5 text-xs text-text-dim hover:bg-panel-raised hover:text-text"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M7 16V4M7 4 3 8M7 4l4 4" />
        <path d="M17 8v12M17 20l4-4M17 20l-4-4" />
      </svg>
      Switch scope
    </a>
  </div>
</nav>
