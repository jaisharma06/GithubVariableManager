<div class="flex items-center justify-between gap-3 py-2">
  <div class="min-w-0">
    <p class="truncate font-display text-sm font-semibold text-text">
      {{ levelLabel() }} <span class="font-sans font-normal text-text-dim">&middot; {{ scopeLabel() }}</span>
    </p>
    <p class="truncate text-xs text-text-dim">{{ description() }}</p>
  </div>
  <div class="flex shrink-0 items-center gap-1.5">
    @if (hasClipboard()) {
      <button
        type="button"
        (click)="pasteVariable.emit()"
        title="Paste the variable you copied&mdash;{{ clipboardName() }}&mdash;into this section"
        class="flex items-center gap-1.5 rounded-md border border-line px-2.5 py-1 font-sans text-xs font-medium text-text-dim hover:border-brand hover:text-brand"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="8" y="2" width="8" height="4" rx="1" />
          <path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3" />
        </svg>
        Paste
      </button>
    }
    <button
      type="button"
      (click)="add.emit()"
      class="rounded-md border border-line px-2.5 py-1 font-sans text-xs font-medium text-text-dim hover:border-brand hover:text-brand"
    >
      + Add
    </button>
  </div>
</div>
