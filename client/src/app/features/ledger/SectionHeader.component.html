<div class="flex items-center justify-between gap-3 py-2">
  <div class="min-w-0">
    <p class="truncate font-display text-sm font-semibold text-text">
      {{ levelLabel() }} <span class="font-sans font-normal text-text-dim">&middot; {{ scopeLabel() }}</span>
    </p>
    <p class="truncate text-xs text-text-dim">{{ description() }}</p>
  </div>
  <button
    type="button"
    (click)="add.emit()"
    class="shrink-0 rounded-md border border-line px-2.5 py-1 font-sans text-xs font-medium text-text-dim hover:border-brand hover:text-brand"
  >
    + Add
  </button>
</div>
